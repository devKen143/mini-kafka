[package]
name = "mini-kafka"
version = "0.1.0"
edition = "2021"
description = "A Kafka-style distributed log broker: segmented append-only logs, partitions, consumer groups"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
